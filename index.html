<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050912">
<title>Tacada Mestra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- MENU -->
<section id="menu" class="screen active">
  <div class="panel">
    <div class="rack" aria-hidden="true">
      <i style="--c:#f5c400"></i><i style="--c:#2f6bff"></i><i style="--c:#ff3b3b"></i><i style="--c:#8b3dff"></i>
      <i style="--c:#151515"></i><i style="--c:#10c25a"></i><i style="--c:#ff8a1f"></i>
    </div>
    <h1>Tacada Mestra</h1>
    <p class="sub">Bola 8 em duplas &middot; 2 a 4 jogadores &middot; computador, celular e tablet</p>
    <button class="btn" id="btnOnline">Modo Online</button>
    <button class="btn alt" id="btnLocal">Modo Local</button>
  </div>
</section>

<!-- ONLINE -->
<section id="online" class="screen">
  <div class="panel">
    <h2>Modo Online</h2>
    <label for="pname">Seu nome</label>
    <input id="pname" type="text" maxlength="14" placeholder="Jogador" autocomplete="off">
    <button class="btn" id="btnCreate">Criar sala</button>
    <div class="or"><span>ou entre em uma sala</span></div>
    <label for="jcode">Código da sala</label>
    <input id="jcode" type="text" maxlength="5" placeholder="K7M2P" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <button class="btn alt" id="btnJoin">Entrar na sala</button>
    <button class="link" id="backFromOnline">Voltar</button>
  </div>
</section>

<!-- SALA -->
<section id="lobby" class="screen">
  <div class="panel">
    <h2>Sala</h2>
    <div class="code-row">
      <strong id="roomCode">-----</strong>
      <div class="code-btns">
        <button class="btn small alt" id="copyCode">Código</button>
        <button class="btn small" id="copyLink">Link</button>
      </div>
    </div>
    <ul id="plist"></ul>
    <p class="hint" id="lobbyHint">Compartilhe o código ou o link com seus amigos.</p>
    <button class="btn" id="startOnline">Iniciar partida</button>
    <button class="link" id="leaveLobby">Sair da sala</button>
  </div>
</section>

<!-- LOCAL -->
<section id="localSetup" class="screen">
  <div class="panel">
    <h2>Modo Local</h2>
    <label>Quantos jogadores?</label>
    <div class="seg" id="cnt">
      <button data-n="2" class="on">2</button>
      <button data-n="3">3</button>
      <button data-n="4">4</button>
    </div>
    <div id="names"></div>
    <p class="hint" id="localHint"></p>
    <button class="btn" id="startLocal">Começar</button>
    <button class="link" id="backFromLocal">Voltar</button>
  </div>
</section>

<!-- JOGO -->
<section id="game" class="screen">
  <header id="hud">
    <div class="team" id="team0">
      <div class="tname">Time A</div>
      <div class="names"></div>
      <div class="grp"></div>
      <div class="balls"></div>
    </div>
    <div id="center">
      <div id="turn"></div>
      <div id="msg"></div>
    </div>
    <div class="team right" id="team1">
      <div class="tname">Time B</div>
      <div class="names"></div>
      <div class="grp"></div>
      <div class="balls"></div>
    </div>
  </header>

  <div id="stage"><canvas id="cv" width="1100" height="600"></canvas></div>

  <footer id="controls">
    <button class="link" id="leave">Sair</button>
    <div class="pow">
      <label for="power">Força</label>
      <input id="power" type="range" min="5" max="100" value="50">
      <output id="powVal">50</output>
    </div>
    <button class="btn" id="fire">Tacar</button>
  </footer>

  <div id="end" class="modal">
    <div class="panel">
      <h2 id="endTitle"></h2>
      <p id="endMsg"></p>
      <button class="btn" id="again">Jogar de novo</button>
      <button class="btn alt" id="toMenu">Menu</button>
    </div>
  </div>
</section>

<div id="toast"></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="script.js"></script>
</body>
</html>
